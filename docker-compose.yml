version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: quizy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reyanothegoat
      POSTGRES_DB: quizy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
